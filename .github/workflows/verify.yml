name: AgentIR Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: agentir generate --output reports/generated
      - run: agentir replay incidents/01-indirect-prompt-injection/events.jsonl --output reports/injection.json
      - run: agentir replay incidents/05-destructive-action/events.jsonl --output reports/destructive.json
